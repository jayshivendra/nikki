<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_scrapbook_5_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30cfd0" />
      <stop offset="100%" stop-color="#330867" />
    </linearGradient>
    <filter id="shadow_scrapbook_5_svg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#453238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#grad_scrapbook_5_svg)" />

  <!-- Subtle romantic border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" />

  <!-- Inner Soft Card -->
  <rect x="60" y="60" width="680" height="480" rx="18" fill="#ffffff" fill-opacity="0.22" filter="url(#shadow_scrapbook_5_svg)" />

  <!-- Vector Icon Illustration -->
  <g>
    <!-- City silhouette & stars -->
            <rect x="300" y="210" width="45" height="110" fill="#ffffff" opacity="0.6"/>
            <rect x="355" y="170" width="55" height="150" fill="#ffffff" opacity="0.8"/>
            <rect x="420" y="230" width="40" height="90" fill="#ffffff" opacity="0.65"/>
            <rect x="470" y="195" width="50" height="125" fill="#ffffff" opacity="0.75"/>
            <circle cx="330" cy="140" r="25" fill="#fff9c4"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="380" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#3d2a30" text-anchor="middle" letter-spacing="0.5">City Lights At Night</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" fill="#6d4c55" text-anchor="middle" letter-spacing="0.3">Warm tea and city skyline</text>

  <!-- Placeholder notice badge -->
  <g transform="translate(400, 485)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ffffff" fill-opacity="0.85" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9b4a62" text-anchor="middle">✦ Scrapbook Photo 5 (assets/scrapbook-5.jpg) ✦</text>
  </g>
</svg>
