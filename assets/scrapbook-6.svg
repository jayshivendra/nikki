<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_scrapbook_6_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c471ed" />
      <stop offset="100%" stop-color="#f64f59" />
    </linearGradient>
    <filter id="shadow_scrapbook_6_svg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#453238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#grad_scrapbook_6_svg)" />

  <!-- Subtle romantic border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" />

  <!-- Inner Soft Card -->
  <rect x="60" y="60" width="680" height="480" rx="18" fill="#ffffff" fill-opacity="0.22" filter="url(#shadow_scrapbook_6_svg)" />

  <!-- Vector Icon Illustration -->
  <g>
    <circle cx="400" cy="220" r="60" fill="#fff" opacity="0.2"/>
            <path d="M400,160 L408,195 L445,195 L415,217 L426,252 L400,230 L374,252 L385,217 L355,195 L392,195 Z" fill="#ffe57f"/>
            <!-- Shooting star line -->
            <line x1="280" y1="140" x2="350" y2="180" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="490" cy="160" r="4" fill="#ffffff"/>
            <circle cx="310" cy="270" r="3" fill="#ffffff"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="380" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#3d2a30" text-anchor="middle" letter-spacing="0.5">Stargazing Night</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" fill="#6d4c55" text-anchor="middle" letter-spacing="0.3">Counting stars and making wishes</text>

  <!-- Placeholder notice badge -->
  <g transform="translate(400, 485)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ffffff" fill-opacity="0.85" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9b4a62" text-anchor="middle">✦ Scrapbook Photo 6 (assets/scrapbook-6.jpg) ✦</text>
  </g>
</svg>
