<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_scrapbook_3_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecd2" />
      <stop offset="100%" stop-color="#fcb69f" />
    </linearGradient>
    <filter id="shadow_scrapbook_3_svg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#453238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#grad_scrapbook_3_svg)" />

  <!-- Subtle romantic border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" />

  <!-- Inner Soft Card -->
  <rect x="60" y="60" width="680" height="480" rx="18" fill="#ffffff" fill-opacity="0.22" filter="url(#shadow_scrapbook_3_svg)" />

  <!-- Vector Icon Illustration -->
  <g>
    <!-- Cupcake / pastry with cherry -->
            <path d="M350,240 L450,240 L435,310 L365,310 Z" fill="#d7ccc8"/>
            <path d="M335,240 C335,190 465,190 465,240 Z" fill="#f8bbd0"/>
            <circle cx="400" cy="180" r="14" fill="#e91e63"/>
            <path d="M405,170 Q420,150 430,155" stroke="#4caf50" stroke-width="4" fill="none"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="380" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#3d2a30" text-anchor="middle" letter-spacing="0.5">Favorite Cafe Date</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" fill="#6d4c55" text-anchor="middle" letter-spacing="0.3">Sweet treats and deep talks</text>

  <!-- Placeholder notice badge -->
  <g transform="translate(400, 485)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ffffff" fill-opacity="0.85" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9b4a62" text-anchor="middle">✦ Scrapbook Photo 3 (assets/scrapbook-3.jpg) ✦</text>
  </g>
</svg>
