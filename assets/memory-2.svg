<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_memory_2_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fad0c4" />
      <stop offset="100%" stop-color="#ffd1ff" />
    </linearGradient>
    <filter id="shadow_memory_2_svg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#453238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#grad_memory_2_svg)" />

  <!-- Subtle romantic border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" />

  <!-- Inner Soft Card -->
  <rect x="60" y="60" width="680" height="480" rx="18" fill="#ffffff" fill-opacity="0.22" filter="url(#shadow_memory_2_svg)" />

  <!-- Vector Icon Illustration -->
  <g>
    <!-- Cute smiling coffee mugs toasting -->
            <rect x="300" y="210" width="85" height="95" rx="16" fill="#ffffff" opacity="0.92"/>
            <path d="M300,230 C270,230 270,270 300,270" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.92"/>
            <!-- Coffee 2 -->
            <rect x="415" y="210" width="85" height="95" rx="16" fill="#ffffff" opacity="0.92"/>
            <path d="M500,230 C530,230 530,270 500,270" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.92"/>
            <!-- Cute hearts steam -->
            <path d="M342,185 C336,175 320,175 320,190 C320,205 342,218 342,218 C342,218 364,205 364,190 C364,175 348,175 342,185 Z" fill="#f48fb1"/>
            <path d="M457,175 C451,165 435,165 435,180 C435,195 457,208 457,208 C457,208 479,195 479,180 C479,165 463,165 457,175 Z" fill="#f48fb1"/>
            <!-- Sparkles -->
            <circle cx="400" cy="180" r="10" fill="#fff9c4"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="380" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#3d2a30" text-anchor="middle" letter-spacing="0.5">A Funny Moment</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" fill="#6d4c55" text-anchor="middle" letter-spacing="0.3">Laughing until our cheeks hurt</text>

  <!-- Placeholder notice badge -->
  <g transform="translate(400, 485)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ffffff" fill-opacity="0.85" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9b4a62" text-anchor="middle">✦ Replace with your funny moment photo (e.g. assets/memory-2.jpg) ✦</text>
  </g>
</svg>
