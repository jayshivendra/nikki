<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_memory_3_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc2eb" />
      <stop offset="100%" stop-color="#a6c1ee" />
    </linearGradient>
    <filter id="shadow_memory_3_svg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#453238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#grad_memory_3_svg)" />

  <!-- Subtle romantic border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" />

  <!-- Inner Soft Card -->
  <rect x="60" y="60" width="680" height="480" rx="18" fill="#ffffff" fill-opacity="0.22" filter="url(#shadow_memory_3_svg)" />

  <!-- Vector Icon Illustration -->
  <g>
    <!-- Sunset hills and warm glowing sun -->
            <circle cx="400" cy="230" r="65" fill="#fef9d7" opacity="0.95"/>
            <path d="M220,330 C290,260 360,290 420,270 C480,250 540,290 580,330 L220,330 Z" fill="#9575cd" opacity="0.5"/>
            <path d="M200,340 C300,290 400,320 500,290 C550,275 600,310 620,340 L180,340 Z" fill="#7e57c2" opacity="0.7"/>
            <path d="M400,140 L403,150 L413,153 L403,156 L400,166 L397,156 L387,153 L397,150 Z" fill="#ffffff"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="380" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#3d2a30" text-anchor="middle" letter-spacing="0.5">A Day I Felt Grateful</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" fill="#6d4c55" text-anchor="middle" letter-spacing="0.3">Quietly realizing how lucky I am</text>

  <!-- Placeholder notice badge -->
  <g transform="translate(400, 485)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ffffff" fill-opacity="0.85" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9b4a62" text-anchor="middle">✦ Replace with your grateful moment photo (e.g. assets/memory-3.jpg) ✦</text>
  </g>
</svg>
